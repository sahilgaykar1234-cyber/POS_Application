name: pos_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^3.0.0
  cloud_firestore: ^5.0.0
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.0
  file_picker: ^10.0.0
  web: ^1.0.0
  firebase_auth: ^5.7.0
  cloud_functions: ^5.6.2
  firebase_storage: ^12.4.10
  fl_chart: ^1.3.1
  crypto: ^3.0.8
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_cloud_firestore: ^3.1.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png

  # Inter (SIL Open Font License, see assets/fonts/Inter-LICENSE.txt), bundled so
  # the POS looks the same offline.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
    # Noto Sans (SIL Open Font License, see assets/fonts/Noto-LICENSE.txt) for
    # Hindi / Marathi / Gujarati text, bundled so no font is fetched online.
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
        - asset: assets/fonts/NotoSansDevanagari-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansDevanagari-Bold.ttf
          weight: 700
    - family: NotoSansGujarati
      fonts:
        - asset: assets/fonts/NotoSansGujarati-Regular.ttf
        - asset: assets/fonts/NotoSansGujarati-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansGujarati-Bold.ttf
          weight: 700
