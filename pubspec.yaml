name: pos_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.0.0
  cloud_firestore: ^5.0.0
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.0
  printing: ^5.13.0
  pdf: ^3.11.0
  file_picker: ^10.0.0
  web: ^1.0.0
  firebase_auth: ^5.7.0
  cloud_functions: ^5.6.2
  firebase_storage: ^12.4.10
  fl_chart: ^1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png

  # Inter (SIL Open Font License, see assets/fonts/Inter-LICENSE.txt), bundled so
  # the POS looks the same offline.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800